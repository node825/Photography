# Generated by OpenSpec for GitHub Copilot coding agent support.
# Prepares the environment the Copilot cloud agent boots into: Node.js,
# both npm projects (client/, server/ — there is no root package.json, see
# AGENTS.md), and the OpenSpec CLI used by the spec-driven agent workflow.

name: "Copilot Setup Steps"

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 24.11.0 matches this repo's actual dev environment and satisfies
      # Vite 7's engines requirement (^20.19.0 || >=22.12.0). No .nvmrc or
      # engines field exists in this repo, so this pin is the source of truth.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # client/ and server/ are independent npm projects (no workspaces),
      # each with its own committed lockfile — install both separately.
      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.10.0

      - name: Verify OpenSpec CLI
        run: openspec --version
