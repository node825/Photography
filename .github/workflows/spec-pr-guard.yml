# Enforces the spec-PR contract documented in .github/agents/openspec.agent.md,
# in both directions:
#   - a PR titled `[spec] ...` must touch only files under openspec/
#   - any other PR must NOT touch anything under openspec/
# Runs on every PR (no title filter on the job) so a PR can't dodge the rule
# by never using the [spec] prefix, or by editing the title away after a
# failure. Path-only guard — it does not validate spec content, run lint, or
# run `openspec validate`.

name: "Spec PR Guard"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  spec-pr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pin to the PR's actual head commit (not the default merge ref) so the
      # diff below reflects exactly what the PR branch contains, and so a
      # force-push always re-checks the current head via the `synchronize`
      # trigger rather than a stale merge commit.
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify openspec/ path scope matches PR title
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # The quotes around "[spec]" are load-bearing: in a POSIX case
          # pattern, [ and ] are glob metacharacters (a bracket expression /
          # character class) unless quoted. Without the quotes, "[spec]"
          # would match a single character that is one of s, p, e, or c —
          # not the literal string "[spec]". Do not remove them.
          case "$PR_TITLE" in
            "[spec]"*) IS_SPEC=true ;;
            *) IS_SPEC=false ;;
          esac

          echo "PR title: '${PR_TITLE}' -> classified as $([ "$IS_SPEC" = "true" ] && echo spec || echo non-spec)"

          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files between origin/${BASE_REF} and HEAD."
            exit 0
          fi

          if [ "$IS_SPEC" = "true" ]; then
            OUT_OF_SCOPE="$(printf '%s\n' "$CHANGED_FILES" | grep -v '^openspec/' || true)"

            if [ -n "$OUT_OF_SCOPE" ]; then
              echo "::error::This PR's title starts with [spec], so it must touch only files under openspec/."
              echo "The following changed files are outside openspec/:"
              printf '%s\n' "$OUT_OF_SCOPE" | while IFS= read -r file; do
                echo "::error file=${file}::File outside openspec/ in a [spec] PR"
              done
              exit 1
            fi

            echo "All changed files are scoped to openspec/."
          else
            IN_SCOPE="$(printf '%s\n' "$CHANGED_FILES" | grep '^openspec/' || true)"

            if [ -n "$IN_SCOPE" ]; then
              echo "::error::openspec/ changes only go through a PR titled [spec]. (Archiving completed changes through a non-[spec] PR is not supported yet.)"
              echo "The following changed files under openspec/ are not allowed in this PR:"
              printf '%s\n' "$IN_SCOPE" | while IFS= read -r file; do
                echo "::error file=${file}::openspec/ change outside a [spec]-titled PR"
              done
              exit 1
            fi

            echo "No openspec/ changes in this PR — OK."
          fi
